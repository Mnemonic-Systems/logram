[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "logram-sdk"
dynamic = ["version"]
description = "Step-level caching and replay for Python AI pipelines, keyed on a semantic fingerprint of the code."
authors = [{name = "Idriss El khamlichi"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["llm", "caching", "replay", "ast", "debugging", "mcp", "ai-pipelines"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]
# Core: the SDK (@trace, replay) and the CLI. The MCP server and the dashboard
# API are optional extras.
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
server = [
    "fastapi>=0.120",
    "uvicorn>=0.30",
    "aiosqlite>=0.21",
]
all = ["logram-sdk[mcp,server]"]
dev = [
    "logram-sdk[all]",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
logram = "logram.cli:app"
lg = "logram.cli:app"

[project.urls]
Homepage = "https://github.com/Mnemonic-Systems/logram"
Repository = "https://github.com/Mnemonic-Systems/logram"
Issues = "https://github.com/Mnemonic-Systems/logram/issues"

[tool.flit.module]
name = "logram"

[tool.flit.sdist]
exclude = ["**/.DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
